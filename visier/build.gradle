plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'de.kaju.visier'
    compileSdk 35

    defaultConfig {
        applicationId 'de.kaju.visier'
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile file('visier.jks')
            storePassword 'peilung-release'
            keyAlias 'peilung'
            keyPassword 'peilung-release'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
