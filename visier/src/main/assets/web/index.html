<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E1113">
<title>Visier</title>
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 4l8.5 4.5L12 13 3.5 8.5z"/><path d="M3.5 12.5L12 17l8.5-4.5"/><path d="M3.5 16.5L12 21l8.5-4.5"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></symbol>
    <symbol id="i-aim" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="17.5" r="1" fill="currentColor"/></symbol>
    <symbol id="i-tune" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
    <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M4 4l16 16"/><path d="M9.6 6c.8-.3 1.6-.5 2.4-.5 6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.6 3.4M6.4 7.6C3.9 9.3 2.5 12 2.5 12S6 18.5 12 18.5c1.4 0 2.6-.3 3.7-.8"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 7V4.5h4V7M6.5 7l1 13h9l1-13"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4.5L3.5 6.5v13L9 17.5l6 2 5.5-2v-13L15 6.5z"/><path d="M9 4.5v13M15 6.5v13"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8 18h6.5a3.5 3.5 0 0 0 0-7h-5a3.5 3.5 0 0 1 0-7H16"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="17.5" cy="5.5" r="2.3"/><circle cx="6.5" cy="12" r="2.3"/><circle cx="17.5" cy="18.5" r="2.3"/><path d="M8.5 10.8l7-4.1M8.5 13.2l7 4.1"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M3.5 12h17M16.5 8l4 4-4 4M7.5 8l-4 4 4 4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  </defs>
</svg>

<div id="map" aria-label="Karte"></div>

<header class="top">
  <form id="searchForm" class="search" autocomplete="off">
    <svg class="ic"><use href="#i-search"/></svg>
    <input id="q" type="search" placeholder="Ort oder Koordinaten suchen" enterkeyhint="search" spellcheck="false">
    <button type="button" id="qClear" class="q-clear" aria-label="Suche leeren" hidden><svg class="ic"><use href="#i-close"/></svg></button>
  </form>
  <ul id="results" class="results" hidden></ul>
  <div id="banner" class="banner" hidden>
    <p id="bannerText"></p>
    <button id="bannerCancel" class="link-btn">Abbrechen</button>
  </div>
</header>

<div class="fabs">
  <button id="btnLayers" class="fab" aria-label="Kartenansicht"><svg class="ic"><use href="#i-layers"/></svg></button>
  <button id="btnLocate" class="fab" aria-label="Mein Standort"><svg class="ic"><use href="#i-locate"/></svg></button>
</div>

<nav class="dock">
  <button id="btnList" class="dock-btn"><svg class="ic"><use href="#i-list"/></svg><span>Ziele</span><b id="count" class="badge" hidden>0</b></button>
  <button id="btnAim" class="aim-btn"><svg class="ic"><use href="#i-aim"/></svg><span>Anvisieren</span></button>
  <button id="btnSettings" class="dock-btn"><svg class="ic"><use href="#i-tune"/></svg><span>Optionen</span></button>
</nav>

<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" aria-hidden="true">
  <div class="grab"></div>
  <div id="sheetBody" class="sheet-body"></div>
</section>

<section id="cam" class="cam" hidden>
  <div id="stage" class="stage"><video id="video" playsinline muted autoplay></video></div>
  <div class="cam-shade"></div>
  <div class="cam-top">
    <button id="camClose" class="cam-icon" aria-label="Schließen"><svg class="ic"><use href="#i-close"/></svg></button>
    <div class="readout">
      <div id="hdg" class="hdg">–––°</div>
      <div id="hdgSub" class="hdg-sub">Kompass startet</div>
    </div>
    <div id="gpsChip" class="chip">GPS</div>
  </div>
  <canvas id="tape" class="tape"></canvas>
  <div class="cross" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
  <div id="tapMark" class="tapmark" hidden></div>
  <p id="camHint" class="cam-hint"></p>
  <div class="cam-bottom">
    <div class="zoom">
      <span class="zoom-min">1×</span>
      <input id="zoom" type="range" min="1" max="8" step="0.05" value="1" aria-label="Zoom">
      <span id="zoomVal" class="zoom-val">1,0×</span>
    </div>
    <div class="cam-actions">
      <button id="tapReset" class="cam-text" hidden>Mitte</button>
      <button id="shutter" class="shutter" aria-label="Ziel übernehmen"><span>OK</span></button>
      <span class="cam-spacer"></span>
    </div>
  </div>
  <div id="camError" class="cam-error" hidden>
    <p id="camErrorText"></p>
    <button id="camErrorBtn" class="btn">App-Einstellungen öffnen</button>
  </div>
</section>

<div id="toast" class="toast" role="status" hidden></div>

<script src="lib/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
