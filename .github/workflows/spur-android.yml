name: Spur App bauen

on:
  push:
    branches: [ spur ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      KS_B64: ${{ secrets.SPUR_KEYSTORE_BASE64 }}
      SPUR_KEYSTORE_PASSWORD: ${{ secrets.SPUR_KEYSTORE_PASSWORD }}
      SPUR_KEY_ALIAS: ${{ secrets.SPUR_KEY_ALIAS }}
      SPUR_KEY_PASSWORD: ${{ secrets.SPUR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Play-Store-Schluessel einrichten (optional)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "SPUR_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: APK + App-Bundle bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Spur.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Spur-APK
          path: Spur.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Spur-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Release mit APK veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: spur-v1.0.${{ github.run_number }}
          name: Spur 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "false"
          body: |
            Spur – Kamera-App mit eigenem Server. APK direkt aufs Handy laden und installieren.
          files: Spur.apk
