name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Leaflet einbinden
        run: |
          set -e
          cd "$RUNNER_TEMP"
          npm pack leaflet@1.9.4
          tar xzf leaflet-1.9.4.tgz
          for M in app visier; do
            LIB="$GITHUB_WORKSPACE/$M/src/main/assets/web/lib"
            mkdir -p "$LIB"
            cp package/dist/leaflet.js package/dist/leaflet.css "$LIB/"
            cp -r package/dist/images "$LIB/"
          done

      - name: APKs bauen
        run: gradle :app:assembleRelease :visier:assembleRelease --no-daemon --stacktrace

      - name: APKs umbenennen
        run: |
          cp app/build/outputs/apk/release/app-release.apk Peilung.apk
          cp visier/build/outputs/apk/release/visier-release.apk Visier.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Apps
          path: |
            Peilung.apk
            Visier.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Peilung & Visier 1.0.${{ github.run_number }}
          body: |
            APKs zum direkten Installieren auf Android.
            Peilung: https://github.com/${{ github.repository }}/releases/latest/download/Peilung.apk
            Visier: https://github.com/${{ github.repository }}/releases/latest/download/Visier.apk
          files: |
            Peilung.apk
            Visier.apk
          make_latest: true
